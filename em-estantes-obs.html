const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function intersects(a,b,pad=16){return a.x<b.x+b.w+pad&&a.x+a.w+pad>b.x&&a.y<b.y+b.h+pad&&a.y+a.h+pad>b.y}
function spawn(s,t){
 if(shelves.filter(q=>q.active).length>=6){s.next=t+between(.2,.7);return}
 let candidate,found=false;
 for(let n=0;n<100;n++){
  const m=models[s.model];const scale=2+Math.floor(rnd()*(m.sh===64?2:3)),h=m.sh*scale,w=m.sw*scale;
  candidate={x:between(42,918-w),y:between(42,495-h),w,h};
  // Keep the central title readable; furniture can appear elsewhere on the screen.
  if(intersects(candidate,{x:273,y:160,w:414,h:175},10))continue;
  if(intersects(candidate,{x:430,y:86,w:104,h:103},8))continue;
  if(shelves.some(q=>q.active&&intersects(candidate,q,8)))continue;
  found=true;break;
 }
 if(!found){s.next=t+between(.15,.6);return}
 Object.assign(s,candidate,{active:true,start:t,fadeIn:between(.12,.4),hold:between(.7,2),fadeOut:between(.12,.45),phase:between(0,TAU),drift:between(.3,1.1)});
 s.end=t+s.fadeIn+s.hold+s.fadeOut;
}
function update(t){
 for(const s of shelves){
  if(s.active&&t>=s.end){s.active=false;s.next=t+between(.25,2.2);s.model=Math.floor(rnd()*models.length)}
  if(!s.active&&t>=s.next)spawn(s,t);
 }
}
function text(s,y,size,color){g.font=`${size}px monospace`;g.textAlign='center';g.fillStyle=color;g.fillText(s,480,y)}
function draw(t){
 g.globalAlpha=1;g.fillStyle='#090711';g.fillRect(0,0,960,540);
 const bg=g.createRadialGradient(480,260,20,480,270,520);bg.addColorStop(0,'#23182f');bg.addColorStop(1,'#090711');g.fillStyle=bg;g.fillRect(0,0,960,540);
 for(const s of stars){g.globalAlpha=.2+.45*(.5+.5*Math.sin(t*.6+s.p));g.fillStyle='#b5a0c7';g.fillRect(s.x,s.y,s.z,s.z)}
 g.globalAlpha=1;g.lineWidth=1;g.strokeStyle='#79603e';g.strokeRect(17.5,17.5,925,505);g.strokeStyle='#30263d';g.strokeRect(23.5,23.5,913,493);
 for(const s of shelves){if(!s.active)continue;
  const age=t-s.start,a=smooth(age/s.fadeIn)*smooth((s.end-t)/s.fadeOut),y=s.y+Math.sin(t*s.drift+s.phase)*2;
  const m=models[s.model];g.globalAlpha=a;g.drawImage(im,m.sx,0,m.sw,m.sh,Math.round(s.x),Math.round(y),s.w,s.h);
  const pulse=4*a*(1-a);g.globalAlpha=pulse*.6;g.strokeStyle=s.model===2||s.model===3?'#cba7f6':'#75daca';g.lineWidth=1;
  g.beginPath();g.ellipse(s.x+s.w/2,y+s.h-5,s.w*.54,7,0,0,TAU);g.stroke();
  for(let j=0;j<8;j++){const phase=t*1.3+j*TAU/8;g.fillStyle=j%2?'#e6c187':'#91f1db';g.fillRect(s.x+s.w/2+Math.cos(phase)*s.w*.5,y+s.h-8+Math.sin(phase)*8-j*2,2,2)}
 }
 g.globalAlpha=1;
 // Original title-screen C-clock and separate original hands (daemoth / Square).
 // Body pivot in original sheet: (201,60). Hand pivots: (172,106), (184,106).
 g.save();g.translate(480,139);g.drawImage(clock,0,0,48,88,-38,-46,48,88);
 g.save();g.rotate(t*TAU/3.6+Math.PI);g.drawImage(clock,81,0,7,29,-3,-3,7,29);g.restore();
 g.save();g.rotate(t*TAU/.75+Math.PI/2);g.drawImage(clock,48,0,33,7,-30,-3,33,7);g.restore();g.restore();
 text('A LIVE COMEÇA',204,13,'#85c4bb');text('EM',246,25,'#dfc98e');
 g.save();g.shadowColor='#090711';g.shadowOffsetX=3;g.shadowOffsetY=4;text('ESTANTES',302,58,'#f3dfac');g.restore();
 g.fillStyle='#765c3f';g.fillRect(362,322,236,1);g.fillStyle='#d0ae70';g.fillRect(477,320,6,5);
 g.globalAlpha=1;
}
window.renderAt=t=>{while(sim<t){sim=Math.min(t,sim+1/24);update(sim)}draw(t)};
window.sceneState=()=>shelves.map(({i,model,active,start,fadeIn,hold,fadeOut,next,x,y,w,h})=>({i,model,active,start,fadeIn,hold,fadeOut,next,x,y,w,h}));
window.ready=Promise.all([im,clock].map(img=>new Promise((resolve,reject)=>{if(img.complete&&img.naturalWidth){resolve();return}img.addEventListener('load',resolve,{once:true});img.addEventListener('error',()=>reject(new Error('Erro ao carregar sprite incorporado')),{once:true})}))).then(()=>{draw(0);if(!offline)requestAnimationFrame(tick)});
function tick(ms){if(prev===null)prev=ms;sim+=Math.min((ms-prev)/1000,.15);prev=ms;update(sim);draw(sim);requestAnimationFrame(tick)}
