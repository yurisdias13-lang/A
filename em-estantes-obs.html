const smooth=x=>{x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)};
function intersects(a,b,pad=16){return a.x<b.x+b.w+pad&&a.x+a.w+pad>b.x&&a.y<b.y+b.h+pad&&a.y+a.h+pad>b.y}
function spawn(s,t){
 if(shelves.filter(q=>q.active).length>=6){s.next=t+between(.8,2.5);return}
 let candidate,found=false;
 for(let n=0;n<100;n++){
  const m=models[s.model];const scale=2+Math.floor(rnd()*3),h=48*scale,w=m.sw*scale;
  candidate={x:between(42,918-w),y:between(42,495-h),w,h};
  // Keep the central title readable; furniture can appear elsewhere on the screen.
  if(intersects(candidate,{x:273,y:160,w:414,h:175},10))continue;
  if(shelves.some(q=>q.active&&intersects(candidate,q,8)))continue;
  found=true;break;
 }
 if(!found){s.next=t+between(.5,2);return}
 Object.assign(s,candidate,{active:true,start:t,fadeIn:between(.3,1.7),hold:between(1.4,7.5),fadeOut:between(.35,2.1),phase:between(0,TAU),drift:between(.3,1.1)});
 s.end=t+s.fadeIn+s.hold+s.fadeOut;
}
function update(t){
 for(const s of shelves){
  if(s.active&&t>=s.end){s.active=false;s.next=t+between(1.8,15);s.model=Math.floor(rnd()*models.length)}
  if(!s.active&&t>=s.next)spawn(s,t);
 }
}

 for(const s of shelves){if(!s.active)continue;

 }

 for(let j=0;j<12;j++){const a=j*TAU/12;g.fillStyle='#b99b64';g.fillRect(Math.sin(a)*17-1,-Math.cos(a)*17-1,2,2)}
 g.rotate(t*.2);g.strokeStyle='#78c7ba';g.beginPath();g.moveTo(0,3);g.lineTo(0,-14);g.stroke();g.rotate(-t*.16);g.strokeStyle='#e0c285';g.beginPath();g.moveTo(0,0);g.lineTo(9,-5);g.stroke();g.restore();

window.renderAt=t=>{while(sim<t){sim=Math.min(t,sim+1/24);update(sim)}draw(t)};
